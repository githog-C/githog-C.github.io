/* ═══════════════════════════════════════════════════════
   MAIN EVENT WIRING
═══════════════════════════════════════════════════════ */
function initEvents() {
  const svg = document.getElementById('svg-canvas');

  // Tool switching
  document.querySelectorAll('.tool-btn[data-tool]').forEach(btn => {
    btn.addEventListener('click', () => {
      setTool(btn.dataset.tool);
    });
  });
  document.getElementById('tool-delete').addEventListener('click', deleteSelected);

  // Canvas mouse events
  let lastMousePt = { x: 0, y: 0 };
  let clickTimer = null, lastClickTime = 0;

  // Listen on canvas-container so handle divs (which sit on top of SVG) also trigger dispatch
  document.getElementById('canvas-container').addEventListener('mousedown', e => {
    if (e.button !== 0) return;
    e.preventDefault();
    if (state.tool === 'pan') {
      const scroll = document.getElementById('canvas-scroll');
      panDrw.active = true;
      panDrw.startX = e.clientX; panDrw.startY = e.clientY;
      panDrw.scrollLeft = scroll.scrollLeft; panDrw.scrollTop = scroll.scrollTop;
      document.getElementById('svg-canvas').classList.add('panning');
      return;
    }
    const pt = getSnapSVGPt(e);
    lastMousePt = pt;
    dispatch('mousedown', e, pt);
  });

  window.addEventListener('mousemove', e => {
    if (state.tool === 'pan' && panDrw.active) {
      const scroll = document.getElementById('canvas-scroll');
      scroll.scrollLeft = panDrw.scrollLeft - (e.clientX - panDrw.startX);
      scroll.scrollTop  = panDrw.scrollTop  - (e.clientY - panDrw.startY);
      return;
    }
    const pt = getSnapSVGPt(e);
    lastMousePt = pt;
    document.getElementById('status-xy').textContent = `${Math.round(pt.x)}, ${Math.round(pt.y)}`;
    if (state.tool === 'select') selectToolMouseMove(e, pt);
    else if (state.tool === 'rect') rectMouseMove(e, pt);
    else if (state.tool === 'ellipse') ellipseMouseMove(e, pt);
    else if (state.tool === 'line') lineMouseMove(e, pt);
    else if (state.tool === 'path') pathMouseMove(e, pt);
  });

  window.addEventListener('mouseup', e => {
    if (e.button !== 0) return;
    if (state.tool === 'pan') {
      panDrw.active = false;
      document.getElementById('svg-canvas').classList.remove('panning');
      return;
    }
    const pt = getSnapSVGPt(e);
    if (state.tool === 'select') selectToolMouseUp(e);
    else if (state.tool === 'rect') rectMouseUp(e, pt);
    else if (state.tool === 'ellipse') ellipseMouseUp(e, pt);
    else if (state.tool === 'line') pathMouseUp();
    else if (state.tool === 'path') pathMouseUp();
  });

  svg.addEventListener('dblclick', e => {
    if (state.tool !== 'path') return;
    const pt = getSnapSVGPt(e);
    pathDblClick(e, pt);
  });

  // Wheel zoom
  document.getElementById('canvas-scroll').addEventListener('wheel', e => {
    e.preventDefault();
    const delta = e.deltaY > 0 ? -0.1 : 0.1;
    setZoom(state.zoom + delta * state.zoom);
  }, { passive: false });

  // Keyboard
  window.addEventListener('keydown', e => {
    const tag = document.activeElement.tagName;
    if (tag === 'INPUT' || tag === 'TEXTAREA') return;
    if ((e.ctrlKey || e.metaKey) && e.key === 'z') { e.preventDefault(); undo(); return; }
    if ((e.ctrlKey || e.metaKey) && (e.key === 'y' || (e.shiftKey && e.key === 'z'))) { e.preventDefault(); redo(); return; }
    if ((e.ctrlKey || e.metaKey) && e.key === 'a') { e.preventDefault(); state.selectedIds = state.shapes.filter(s => !s.locked).map(s => s.id); renderHandles(); renderProperties(); renderLayers(); return; }
    if (e.key === 'Delete' || e.key === 'Backspace') { e.preventDefault(); deleteSelected(); return; }
    if (e.key === 'Escape') {
      if (pathDrw.active) { pathDrw.active = false; pathDrw.nodes = []; clearPreview(); return; }
      if (lineDrw.active) { lineDrw.active = false; drw.active = false; clearPreview(); return; }
      state.selectedIds = []; renderHandles(); renderProperties(); renderLayers(); return;
    }
    // Space bar: temporary pan
    if (e.code === 'Space' && !e.ctrlKey && !e.metaKey) {
      e.preventDefault();
      if (state.tool !== 'pan') { prevTool = state.tool; setTool('pan'); }
      return;
    }
    // Tool shortcuts
    const toolKeys = { v: 'select', r: 'rect', e: 'ellipse', l: 'line', p: 'path', h: 'pan' };
    const tool = toolKeys[e.key.toLowerCase()];
    if (tool && !e.ctrlKey && !e.metaKey) { setTool(tool); return; }
    // Arrow nudge
    if (state.selectedIds.length > 0 && ['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(e.key)) {
      e.preventDefault();
      const step = e.shiftKey ? 10 : 1;
      const dx = e.key === 'ArrowLeft' ? -step : e.key === 'ArrowRight' ? step : 0;
      const dy = e.key === 'ArrowUp' ? -step : e.key === 'ArrowDown' ? step : 0;
      getSelected().forEach(sh => moveShape(sh, dx, dy));
      pushHistory();
      renderAll();
    }
  });

  // Space keyup: restore previous tool after temporary pan
  window.addEventListener('keyup', e => {
    if (e.code === 'Space' && state.tool === 'pan' && prevTool !== null) {
      setTool(prevTool);
      prevTool = null;
    }
  });

  // Topbar buttons
  document.getElementById('btn-undo').addEventListener('click', undo);
  document.getElementById('btn-redo').addEventListener('click', redo);

  document.getElementById('btn-snap').addEventListener('click', () => {
    state.snapToGrid = !state.snapToGrid;
    document.getElementById('btn-snap').classList.toggle('active', state.snapToGrid);
  });

  document.getElementById('btn-zoom-in').addEventListener('click', () => setZoom(state.zoom * 1.25));
  document.getElementById('btn-zoom-out').addEventListener('click', () => setZoom(state.zoom / 1.25));
  document.getElementById('btn-zoom-reset').addEventListener('click', () => setZoom(1));

  document.getElementById('btn-export').addEventListener('click', exportSVG);

  document.getElementById('btn-lang').addEventListener('click', () => {
    state.lang = state.lang === 'zh-TW' ? 'en-GB' : 'zh-TW';
    applyI18n();
  });

  document.getElementById('btn-dark').addEventListener('click', () => {
    state.darkMode = !state.darkMode;
    applyTheme();
  });

  // Tabs
  document.querySelectorAll('.panel-tab').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.panel-tab').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById('tab-' + btn.dataset.tab).classList.add('active');
    });
  });

  // Copy button
  document.getElementById('btn-copy').addEventListener('click', async () => {
    await navigator.clipboard.writeText(generateSVG()).catch(() => {});
    const btn = document.getElementById('btn-copy');
    const orig = btn.textContent;
    btn.textContent = t('copyDone');
    btn.classList.add('copied');
    setTimeout(() => { btn.textContent = orig; btn.classList.remove('copied'); }, 1500);
  });

  // Import button
  document.getElementById('btn-import').addEventListener('click', () => {
    document.getElementById('import-textarea').value = '';
    document.getElementById('modal-overlay').classList.add('open');
    document.getElementById('import-textarea').focus();
  });
  document.getElementById('modal-cancel').addEventListener('click', closeModal);
  document.getElementById('modal-overlay').addEventListener('click', e => { if (e.target === document.getElementById('modal-overlay')) closeModal(); });
  document.getElementById('modal-confirm').addEventListener('click', () => {
    const code = document.getElementById('import-textarea').value.trim();
    if (code) importSVGFromString(code);
    closeModal();
  });

  // Properties panel inputs
  initPropInputs();
}

function dispatch(event, e, pt) {
  if (state.tool === 'select') selectToolMouseDown(e, pt);
  else if (state.tool === 'rect') rectMouseDown(e, pt);
  else if (state.tool === 'ellipse') ellipseMouseDown(e, pt);
  else if (state.tool === 'line') lineMouseDown(e, pt);
  else if (state.tool === 'path') pathMouseDown(e, pt);
}

function closeModal() {
  document.getElementById('modal-overlay').classList.remove('open');
}

function setTool(tool) {
  // Finish any active path
  if (state.tool === 'path' && pathDrw.active) {
    finishPath(false);
  }
  if (state.tool === 'line' && lineDrw.active) {
    lineDrw.active = false; drw.active = false; clearPreview();
  }
  state.tool = tool;
  document.querySelectorAll('.tool-btn').forEach(b => b.classList.remove('active'));
  const btn = document.querySelector(`[data-tool="${tool}"]`);
  if (btn) btn.classList.add('active');
  const svg = document.getElementById('svg-canvas');
  svg.setAttribute('class', `tool-${tool}`);
  document.getElementById('status-hint').textContent = pathDrw.active ? t('hint').drawing : (t('hint')[tool] || '');
}

function deleteSelected() {
  if (state.selectedIds.length === 0) return;
  state.shapes = state.shapes.filter(s => !state.selectedIds.includes(s.id));
  state.selectedIds = [];
  pushHistory();
  renderAll();
}

function exportSVG() {
  const code = generateSVG();
  const blob = new Blob([code], { type: 'image/svg+xml' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'drawing.svg'; a.click();
  URL.revokeObjectURL(url);
}

/* ═══════════════════════════════════════════════════════
   PROPERTY INPUTS INIT
═══════════════════════════════════════════════════════ */
function initPropInputs() {
  function getPropShape() {
    const sel = getSelected();
    return sel.length ? sel[0] : null;
  }
  function propChange(fn) {
    if (propSuppressUpdate) return;
    const sh = getPropShape();
    if (!sh) return;
    fn(sh);
    pushHistory();
    renderAll();
  }

  // Fill color
  document.getElementById('fill-color').addEventListener('input', e => {
    propChange(sh => { sh.fill = e.target.value; document.getElementById('fill-hex').value = e.target.value; document.getElementById('fill-swatch').style.background = e.target.value; });
  });
  document.getElementById('fill-hex').addEventListener('change', e => {
    let v = e.target.value.trim();
    if (!v.startsWith('#')) v = '#' + v;
    if (/^#[0-9a-fA-F]{6}$/.test(v)) propChange(sh => { sh.fill = v; document.getElementById('fill-color').value = v; document.getElementById('fill-swatch').style.background = v; });
  });
  document.getElementById('fill-none').addEventListener('change', e => {
    propChange(sh => {
      sh.fill = e.target.checked ? 'none' : (document.getElementById('fill-color').value || '#6366f1');
      document.getElementById('fill-swatch').style.background = e.target.checked ? 'transparent' : sh.fill;
      document.getElementById('fill-color').disabled = e.target.checked;
    });
  });

  // Stroke color
  document.getElementById('stroke-color').addEventListener('input', e => {
    propChange(sh => { sh.stroke = e.target.value; document.getElementById('stroke-hex').value = e.target.value; document.getElementById('stroke-swatch').style.background = e.target.value; });
  });
  document.getElementById('stroke-hex').addEventListener('change', e => {
    let v = e.target.value.trim();
    if (!v.startsWith('#')) v = '#' + v;
    if (/^#[0-9a-fA-F]{6}$/.test(v)) propChange(sh => { sh.stroke = v; document.getElementById('stroke-color').value = v; document.getElementById('stroke-swatch').style.background = v; });
  });
  document.getElementById('stroke-none').addEventListener('change', e => {
    propChange(sh => {
      sh.stroke = e.target.checked ? 'none' : (document.getElementById('stroke-color').value || '#000000');
      document.getElementById('stroke-swatch').style.background = e.target.checked ? 'transparent' : sh.stroke;
      document.getElementById('stroke-color').disabled = e.target.checked;
    });
  });

  // Stroke width
  function syncSW(val) {
    document.getElementById('stroke-width').value = val;
    document.getElementById('stroke-width-range').value = val;
  }
  document.getElementById('stroke-width').addEventListener('input', e => {
    const v = Math.max(0, parseFloat(e.target.value) || 0);
    document.getElementById('stroke-width-range').value = v;
    propChange(sh => sh.strokeWidth = v);
  });
  document.getElementById('stroke-width-range').addEventListener('input', e => {
    const v = parseFloat(e.target.value);
    document.getElementById('stroke-width').value = v;
    propChange(sh => sh.strokeWidth = v);
  });

  // Opacity
  document.getElementById('opacity-val').addEventListener('input', e => {
    const v = clamp(parseFloat(e.target.value) || 0, 0, 1);
    document.getElementById('opacity-range').value = v;
    propChange(sh => sh.opacity = v);
  });
  document.getElementById('opacity-range').addEventListener('input', e => {
    const v = parseFloat(e.target.value);
    document.getElementById('opacity-val').value = v;
    propChange(sh => sh.opacity = v);
  });
}

/* ═══════════════════════════════════════════════════════
   INIT
═══════════════════════════════════════════════════════ */
function appInit() {
  initCodeMirror();
  setZoom(1);
  applyTheme();
  applyI18n();
  initEvents();
  pushHistory();
  updateUndoRedo();
  updateStatusBar();
  updateCodePanel();
}

document.addEventListener('DOMContentLoaded', () => {
  // Wait for CodeMirror load attempt before initialising
  if (window.__cmReady) { appInit(); }
  else { document.addEventListener('cmready', appInit); }
});
</script>

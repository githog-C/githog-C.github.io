    el.className = 'tools';
    sh.rows.forEach(function (row, ri) {
      var tr = document.createElement('tr');
      row.forEach(function (c) {
        if (c.merged) return;
        var td = document.createElement(ri === 0 ? 'th' : 'td');
        td.innerHTML = c.paras.map(function (p) { return ppRunsHTML(p.runs, {}); }).join('<br>') || '　';
        tr.appendChild(td);
      });
      el.appendChild(tr);
    });
  }
  if (!el) return;
  ppPlace(el, sh, {}, cb, sh.kind === 'pic');
  screen.appendChild(el);
  stats.add++;
}

function ppApplyShape(sh, screen, isNew, M, parentDelta, parentBox) {
  /* names: pp:N | pp:N:box | pp:N:grp | pp:N:sK | pp:N:before | pp:N:after | pp:N:box:bK ; footer copies end in :f */
  var m = /^pp:(\d+)((?::[a-z]+\d*)*?)(:f)?$/.exec(sh.name || '');
  var parts = m ? m[2].split(':').filter(Boolean) : [];
  var kind = parts.length ? parts[parts.length - 1] : '';
  var key = m ? sh.name : null;   /* geometry keys carry the :f suffix too */
  var g = key && M.geom.shapes[key];
  var el = m && M.byId[m[1]];
  var isFooter = !!(m && m[3]);
  var isPseudo = !!(m && (kind === 'before' || kind === 'after' || /^b\d+$/.test(kind)));
  if (m && (isPseudo || isFooter) && (M.seen[sh.name] || isNew || M.clone)) return null;   /* repeated per slide or decorative: nothing to apply */
  if (isPseudo && !M.seen[sh.name]) { M.seen[sh.name] = true; return null; }
  if (isNew || !m || !g || !el || M.seen[sh.name]) { ppNewShape(sh, screen, M.stats, M.lang); return null; }
  M.seen[sh.name] = true;
  var isSeg = /^s\d+$/.test(kind), isGrp = kind === 'grp';
  var delta = { dx: sh.x - g.x, dy: sh.y - g.y };
  if (isGrp) {
    /* the group's own box child carries the move; children compare against the box's delta */
    var boxSh = (sh.children || []).filter(function (c) { return c.name === key.replace(/:grp$/, ':box') + (isFooter ? ':f' : ''); })[0];
    var boxDelta = boxSh ? { dx: boxSh.x - (M.geom.shapes[key.replace(/:grp$/, ':box')] || g).x, dy: boxSh.y - (M.geom.shapes[key.replace(/:grp$/, ':box')] || g).y } : delta;
    var boxNew = null;
    (sh.children || []).forEach(function (c) {
      var res = ppApplyShape(c, screen, false, M, c === boxSh ? parentDelta : boxDelta, c === boxSh ? parentBox : (boxNew || parentBox));
      if (c === boxSh && res) boxNew = res;
    });
    return boxNew;
  }
  if (sh.kind === 'sp' && g.k === 'txt' && sh.paras) {
    var nt = ppNormText(ppParasText(sh.paras));
    if (nt !== ppNormText(g.t)) { ppApplyText(el, isSeg ? M.segNodes[key] : null, sh.paras, g, M.lang); M.stats.text++; }
  } else if (sh.kind === 'tbl' && g.k === 'tbl') {
    ppApplyTable(el, sh, g, M);
  } else if (sh.kind === 'pic' && g.k === 'pic') {
    if (sh.hash && sh.hash !== g.hash && sh.bytes) { el.setAttribute('src', 'data:' + sh.mime + ';base64,' + ppB64(sh.bytes)); M.stats.pic++; }
  }
  if (isSeg || isFooter || g.x === undefined) return null;
  var moved = Math.abs(delta.dx) > 2 || Math.abs(delta.dy) > 2;
  var resized = Math.abs(sh.w - g.w) > 2 || Math.abs(sh.h - g.h) > 2;
  var withParent = parentDelta && Math.abs(delta.dx - parentDelta.dx) <= 2 && Math.abs(delta.dy - parentDelta.dy) <= 2;
  if ((moved && !withParent) || resized) {
    if (!(g.k === 'txt' && resized && !moved && Math.abs(sh.w - g.w) <= 2)) {   /* height-only change of a text box is PowerPoint autosize noise */
      ppPlace(el, sh, g, parentBox || g.cb || { x: 0, y: 0, w: PP_W, h: PP_H - PP_FOOT }, el.tagName === 'IMG');
      M.stats.move++;
      return { x: sh.x, y: sh.y, w: sh.w, h: sh.h };
    }
  }
  return null;
}

function ppApplyTable(el, sh, g, M) {
  var changed = false, ri, ci;
  var rows = Array.prototype.slice.call(el.rows);
  for (ri = 0; ri < sh.rows.length; ri++) {
    var tr = rows[ri];
    if (!tr) { tr = document.createElement('tr'); el.appendChild(tr); changed = true; }
    var cells = Array.prototype.slice.call(tr.cells), ck = 0;
    for (ci = 0; ci < sh.rows[ri].length; ci++) {
      var c = sh.rows[ri][ci];
      if (c.merged) continue;
      var cell = cells[ck], exp = g.cells[ri + ',' + ci];
      var txt = ppNormText(ppParasText(c.paras));
      if (!cell) {
        cell = document.createElement((ri === 0 && g.cells['0,0'] && g.cells['0,0'].th) ? 'th' : 'td');
        cell.innerHTML = ppRunsHTML([].concat.apply([], c.paras.map(function (p, i) { return (i ? [{ br: true }] : []).concat(p.runs); })), {}) || '　';
        tr.appendChild(cell); changed = true;
      } else if (!exp || txt !== ppNormText(exp.t)) {
        ppSetInner(cell, c.paras.map(function (p) { return ppRunsHTML(p.runs, exp ? { c: exp.c, fs: exp.fs, b: exp.th } : {}); }).join('<br>'), M.lang);
        changed = true;
      }
      ck++;
    }
    for (var k = cells.length - 1; k >= ck; k--) { cells[k].remove(); changed = true; }
  }
  for (var q = rows.length - 1; q >= sh.rows.length; q--) { rows[q].remove(); changed = true; }
  if (changed) M.stats.tbl++;
}

function importPptx(file) {
  var name = file.name || 'PowerPoint 檔';
  if (dirty && !confirm('目前內容尚未下載，匯入會取代現有內容，確定？')) return;
  toast('正在讀取 ' + name + '…');
  file.arrayBuffer().then(zipRead).then(function (z) {
    var dec = new TextDecoder();
    function xml(p) { return z[p] ? new DOMParser().parseFromString(dec.decode(z[p]), 'application/xml') : null; }
    var part = null;
    Object.keys(z).forEach(function (k) {
      if (part || !/^customXml\/item\d+\.xml$/i.test(k)) return;
      var s = dec.decode(z[k]);
      if (s.indexOf(PP_NS) > -1) part = s;
    });
    if (!part) { toast('「' + name + '」不是本編輯器輸出的 PowerPoint 檔（找不到內嵌的簡報內容），已拒絕匯入。'); return; }
    var pd = new DOMParser().parseFromString(part, 'application/xml');
    var html = pd.getElementsByTagNameNS(PP_NS, 'html')[0].textContent;
    var geom = JSON.parse(pd.getElementsByTagNameNS(PP_NS, 'geom')[0].textContent);
    var pres = xml('ppt/presentation.xml');
    if (!pres) { toast('「' + name + '」讀不到簡報結構，已拒絕匯入。'); return; }
    var prels = ppRelMap(xml('ppt/_rels/presentation.xml.rels'));
    var ids = pres.getElementsByTagNameNS(NS_P, 'sldId'), slides = [];
    for (var i = 0; i < ids.length; i++) {
      var rel = prels[ids[i].getAttributeNS(NS_R, 'id')];
      if (!rel) continue;
      var path = ppJoin('ppt', rel.target), dir = path.replace(/\/[^\/]*$/, ''), base = path.split('/').pop();
      var sdoc = xml(path);
      if (!sdoc) continue;
      var srels = ppRelMap(xml(dir + '/_rels/' + base + '.rels'));
      var cSld = ppFirst(sdoc, NS_P, 'cSld'), tree = ppFirst(sdoc, NS_P, 'spTree');
      var ident = function (x, y, w, h) { return { x: x, y: y, w: w, h: h }; };
      slides.push({ name: cSld ? (cSld.getAttribute('name') || '') : '', shapes: tree ? ppParseTree(tree, ident, srels, dir, z) : [] });
    }
    var res = ppMerge(html, geom, slides);
    pushUndo();
    stage.innerHTML = '';
    res.screens.forEach(function (s) { stage.appendChild(s); });
    footerEl.innerHTML = res.footerHTML;
    setTheme(geom.theme === 'slate' ? 'slate' : 'red');
    setLang(geom.lang === 'en' && stage.querySelector('.en') ? 'en' : 'zh');
    selectSet([]);
    applyEditable();
    dirty = true;
    window.scrollTo(0, 0);
    var st = res.stats, parts = [];
    if (st.text) parts.push('文字修改 ' + st.text + ' 處');
    if (st.tbl) parts.push('表格 ' + st.tbl + ' 個');
    if (st.move) parts.push('位置或大小 ' + st.move + ' 處');
    if (st.pic) parts.push('圖片更換 ' + st.pic + ' 張');
    if (st.del) parts.push('刪除 ' + st.del + ' 個');
    if (st.add) parts.push('新增物件 ' + st.add + ' 個');
    if (st.newSlides) parts.push('新增頁面 ' + st.newSlides + ' 頁');
    if (st.delSlides) parts.push('刪除頁面 ' + st.delSlides + ' 頁');
    toast('已匯入 PowerPoint：' + res.screens.length + ' 頁' + (parts.length ? '；套回 ' + parts.join('、') : '；內容與匯出時相同') +
      (stage.querySelector('.zh, .en') ? '（只更新' + (geom.lang === 'en' ? '英文' : '中文') + '，另一語言維持匯出時的內容）' : '') + '。做完請按「下載簡報」另存為簡報檔。');
  }).catch(function (err) {
    toast('匯入失敗：' + (err && err.message ? err.message : err));
  });
}

function ppMerge(html, geom, slides) {
  var holder = document.createElement('div');
  holder.innerHTML = html;
  var M = { geom: geom, byId: {}, seen: {}, segNodes: {}, stats: { text: 0, move: 0, del: 0, add: 0, pic: 0, tbl: 0, newSlides: 0, delSlides: 0 }, lang: geom.lang || 'zh' };
  var all = holder.querySelectorAll('[data-pp]');
  for (var i = 0; i < all.length; i++) M.byId[all[i].getAttribute('data-pp')] = all[i];
  Object.keys(geom.shapes).forEach(function (k) {
    var g = geom.shapes[k], m = /^pp:(\d+):s(\d+)(?::f)?$/.exec(k);
    if (m && g.seg && M.byId[m[1]]) M.segNodes[k] = g.seg.map(function (ix) { return M.byId[m[1]].childNodes[ix]; }).filter(Boolean);
  });
  var screens = [], used = {};
  slides.forEach(function (sl) {
    var m = /^pp:(\d+)$/.exec(sl.name || ''), scr = m && M.byId[m[1]];
    var known = !!(scr && scr.classList.contains('screen'));
    var isNew = !known;
    var MM = M;
    if (known && used[m[1]]) {
      /* a slide duplicated in PowerPoint: clone the original screen, then apply the copy's edits to the clone */
      scr = used[m[1]].cloneNode(true);
      var map = {}, list = scr.querySelectorAll('[data-pp]');
      for (var q = 0; q < list.length; q++) map[list[q].getAttribute('data-pp')] = list[q];
      map[m[1]] = scr;
      MM = { geom: M.geom, byId: map, seen: {}, segNodes: {}, stats: M.stats, lang: M.lang, clone: true };
      Object.keys(M.segNodes).forEach(function (k) {
        var sm = /^pp:(\d+):s(\d+)/.exec(k), g = M.geom.shapes[k];
        if (sm && g && g.seg && map[sm[1]]) MM.segNodes[k] = g.seg.map(function (ix) { return map[sm[1]].childNodes[ix]; }).filter(Boolean);
      });
      M.stats.newSlides++;
    } else if (known) used[m[1]] = scr;
    else { scr = document.createElement('section'); scr.className = 'screen ribbon'; M.stats.newSlides++; }
    screens.push(scr);
    sl.shapes.forEach(function (sh) { ppApplyShape(sh, scr, isNew, MM, null, null); });
  });
  var origScreens = Array.prototype.filter.call(holder.children, function (c) { return c.classList.contains('screen'); });
  M.stats.delSlides = origScreens.filter(function (s) { return screens.indexOf(s) === -1; }).length;
  /* shapes that vanished in PowerPoint */
  Object.keys(geom.shapes).forEach(function (k) {
    if (M.seen[k] || M.seen[k + ':f']) return;
    var m = /^pp:(\d+)(?::(box|grp|s\d+))?$/.exec(k);
    if (!m) return;
    var el = M.byId[m[1]];
    if (!el || !el.parentNode) return;
    var scr = el.closest('.screen');
    if (!scr || screens.indexOf(scr) === -1) return;
    if (m[2] === 'grp') return;
    if (m[2] === 'box' && geom.shapes[k.replace(/:box$/, ':grp')] && M.seen[k.replace(/:box$/, ':grp')]) return;
    if (m[2] && m[2].charAt(0) === 's') { (M.segNodes[k] || []).forEach(function (n) { if (n.parentNode) n.parentNode.removeChild(n); }); M.stats.del++; return; }
    el.parentNode.removeChild(el);
    M.stats.del++;
  });
  var footer = holder.querySelector('footer.site');
  var strip = [holder].concat(screens);
  strip.forEach(function (root) {
    root.removeAttribute('data-pp');
    var list = root.querySelectorAll('[data-pp]');
    for (var j = 0; j < list.length; j++) list[j].removeAttribute('data-pp');
  });
  return { screens: screens, footerHTML: footer ? footer.innerHTML : '', stats: M.stats };
}
</script>

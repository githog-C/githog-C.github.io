<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>sub-NF</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <div class="brand">
      <span class="dot dot-red"></span><span class="dot dot-pale"></span>
      <h1>sub-NF</h1>
    </div>
    <div class="headtools">
      <button type="button" id="uiLang" class="langbtn"></button>
      <label class="switch" id="enabledLabel">
        <input type="checkbox" id="enabled">
        <span class="slider"></span>
      </label>
    </div>
  </header>

  <p id="status" class="status"></p>

  <section class="row">
    <label for="primaryLang" data-i18n="primaryLang"></label>
    <select id="primaryLang"></select>
  </section>

  <section class="row">
    <label for="secondaryLang" data-i18n="secondaryLang"></label>
    <select id="secondaryLang"></select>
  </section>

  <section class="row inline">
    <label for="swapOrder" data-i18n="swapOrder"></label>
    <input type="checkbox" id="swapOrder">
  </section>

  <section class="row inline">
    <label for="hideNative" data-i18n="hideNative"></label>
    <input type="checkbox" id="hideNative">
  </section>

  <section class="row">
    <label data-i18n="copyNow"></label>
    <div class="btnrow">
      <button type="button" id="copyTop" data-i18n="copyTopBtn"></button>
      <button type="button" id="copyBottom" data-i18n="copyBottomBtn"></button>
      <button type="button" id="copyBoth" data-i18n="copyBothBtn"></button>
    </div>
    <p id="copyPreview" class="hint"></p>
  </section>

  <details>
    <summary data-i18n="tuning"></summary>

    <div class="numgrid">
      <div class="num">
        <span class="num-label" data-i18n-title="fontScale"><svg class="ic" viewBox="0 0 16 16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M1.2 13 L3.9 3.4 L6.6 13" stroke-width="1.6"/><path d="M2.1 10.1 H5.7" stroke-width="1.6"/><path d="M9.4 13 L11.4 6.6 L13.4 13" stroke-width="1.25"/><path d="M10.2 10.9 H12.6" stroke-width="1.25"/></svg></span>
        <span class="spin">
          <button type="button" data-spin="fontScale" data-dir="1"><svg class="chev" viewBox="0 0 14 14" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3.4 8.6 L7 5 L10.6 8.6"/></svg></button>
          <output id="fontScaleOut"></output>
          <button type="button" data-spin="fontScale" data-dir="-1"><svg class="chev" viewBox="0 0 14 14" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3.4 5.4 L7 9 L10.6 5.4"/></svg></button>
        </span>
      </div>
      <div class="num">
        <span class="num-label" data-i18n-title="gap"><svg class="ic" viewBox="0 0 16 16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M2 2.6 H14"/><path d="M2 13.4 H14"/><path d="M8 5.6 V10.4"/><path d="M6.7 6.9 L8 5.6 L9.3 6.9"/><path d="M6.7 9.1 L8 10.4 L9.3 9.1"/></svg></span>
        <span class="spin">
          <button type="button" data-spin="gap" data-dir="1"><svg class="chev" viewBox="0 0 14 14" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3.4 8.6 L7 5 L10.6 8.6"/></svg></button>
          <output id="gapOut"></output>
          <button type="button" data-spin="gap" data-dir="-1"><svg class="chev" viewBox="0 0 14 14" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3.4 5.4 L7 9 L10.6 5.4"/></svg></button>
        </span>
      </div>
      <div class="num">
        <span class="num-label" data-i18n-title="bottomVh"><svg class="ic" viewBox="0 0 16 16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M8 2 V14"/><path d="M5.2 4.8 L8 2 L10.8 4.8"/><path d="M5.2 11.2 L8 14 L10.8 11.2"/></svg></span>
        <span class="spin">
          <button type="button" data-spin="bottomVh" data-dir="1"><svg class="chev" viewBox="0 0 14 14" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3.4 8.6 L7 5 L10.6 8.6"/></svg></button>
          <output id="bottomVhOut"></output>
          <button type="button" data-spin="bottomVh" data-dir="-1"><svg class="chev" viewBox="0 0 14 14" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3.4 5.4 L7 9 L10.6 5.4"/></svg></button>
        </span>
      </div>
      <div class="num">
        <span class="num-label" data-i18n-title="shiftVw"><svg class="ic" viewBox="0 0 16 16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M2 8 H14"/><path d="M4.8 5.2 L2 8 L4.8 10.8"/><path d="M11.2 5.2 L14 8 L11.2 10.8"/></svg></span>
        <span class="spin">
          <button type="button" data-spin="shiftVw" data-dir="1"><svg class="chev" viewBox="0 0 14 14" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3.4 8.6 L7 5 L10.6 8.6"/></svg></button>
          <output id="shiftVwOut"></output>
          <button type="button" data-spin="shiftVw" data-dir="-1"><svg class="chev" viewBox="0 0 14 14" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3.4 5.4 L7 9 L10.6 5.4"/></svg></button>
        </span>
      </div>
    </div>
    </div>

    <section class="row inline">
      <label for="clickToCopy" data-i18n="clickToCopy"></label>
      <input type="checkbox" id="clickToCopy">
    </section>

    <section class="row inline">
      <label for="copyModifierClick" data-i18n="copyModifierClick"></label>
      <input type="checkbox" id="copyModifierClick">
    </section>

    <section class="row inline">
      <label for="fixAllCaps" data-i18n="fixAllCaps"></label>
      <input type="checkbox" id="fixAllCaps">
    </section>

    <section class="row inline">
      <label for="fixAllCapsDisplay" data-i18n="fixAllCapsDisplay"></label>
      <input type="checkbox" id="fixAllCapsDisplay">
    </section>

    <section class="row inline">
      <label for="preferCC" data-i18n="preferCC"></label>
      <input type="checkbox" id="preferCC">
    </section>

    <section class="row inline">
      <label for="stripSdh" data-i18n="stripSdh"></label>
      <input type="checkbox" id="stripSdh">
    </section>

    <section class="row inline">
      <label for="avoidControls" data-i18n="avoidControls"></label>
      <input type="checkbox" id="avoidControls">
    </section>

    <div class="num wide">
      <span class="num-label"><span class="ic-wrap"><svg class="ic" viewBox="0 0 16 16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="8" r="5.6"/><path d="M8 4.8 V8.2 L10.3 9.6"/></svg></span><span data-i18n="primaryOffsetMs"></span></span>
      <span class="spin">
        <button type="button" data-spin="primaryOffsetMs" data-dir="1"><svg class="chev" viewBox="0 0 14 14" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3.4 8.6 L7 5 L10.6 8.6"/></svg></button>
        <output id="primaryOffsetOut"></output>
        <button type="button" data-spin="primaryOffsetMs" data-dir="-1"><svg class="chev" viewBox="0 0 14 14" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3.4 5.4 L7 9 L10.6 5.4"/></svg></button>
      </span>
    </div>

    <div class="num wide">
      <span class="num-label"><span class="ic-wrap"><svg class="ic" viewBox="0 0 16 16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="8" r="5.6"/><path d="M8 4.8 V8.2 L10.3 9.6"/></svg></span><span data-i18n="secondaryOffsetMs"></span></span>
      <span class="spin">
        <button type="button" data-spin="secondaryOffsetMs" data-dir="1"><svg class="chev" viewBox="0 0 14 14" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3.4 8.6 L7 5 L10.6 8.6"/></svg></button>
        <output id="secondaryOffsetOut"></output>
        <button type="button" data-spin="secondaryOffsetMs" data-dir="-1"><svg class="chev" viewBox="0 0 14 14" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3.4 5.4 L7 9 L10.6 5.4"/></svg></button>
      </span>
    </div>
  </details>

  <details id="diagBox">
    <summary data-i18n="diag"></summary>
    <ul id="diagList" class="diag"></ul>
    <p class="hint" data-i18n="diagHint"></p>
  </details>

  <footer>
    <span id="hint" class="hint"></span>
  </footer>

  <script src="popup.js"></script>
</body>
</html>

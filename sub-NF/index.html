<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>sub-NF — Netflix bilingual subtitles</title>
<style>
  :root {
    --bg:#0b0b0b; --panel:#161616; --line:#282828; --text:#f3f3f3;
    --muted:#9b9b9b; --red:#e50914; --pale:#ebebeb; --warm:#f3e9c8;
  }
  * { box-sizing:border-box; }
  html,body { margin:0; }
  body {
    background:var(--bg); color:var(--text);
    font-family:"Helvetica Neue",Roboto,Arial,"Noto Sans TC",system-ui,sans-serif;
    line-height:1.6; -webkit-font-smoothing:antialiased;
  }
  .wrap { max-width:820px; margin:0 auto; padding:48px 22px 80px; }
  .topbar { display:flex; align-items:center; justify-content:space-between; }
  .brand { display:flex; align-items:center; gap:10px; margin-bottom:6px; }
  .bar { height:14px; border-radius:7px; display:inline-block; }
  .bar-red { width:40px; background:var(--red); }
  .bar-pale { width:26px; background:var(--pale); }
  .langbtn {
    font:inherit; font-size:12px; line-height:1; padding:6px 11px; color:var(--muted);
    background:transparent; border:1px solid var(--line); border-radius:999px; cursor:pointer;
  }
  .langbtn:hover { color:var(--text); border-color:var(--muted); }
  h1 { font-size:clamp(30px,6vw,46px); margin:.2em 0 .1em; letter-spacing:.5px; }
  .lede { color:var(--muted); font-size:clamp(15px,2.6vw,18px); margin:0 0 28px; }
  .demo {
    position:relative; background:linear-gradient(160deg,#1e1e1e,#0d0d0d);
    border:1px solid var(--line); border-radius:14px; height:210px; overflow:hidden;
    display:flex; align-items:flex-end; justify-content:center; margin:0 0 34px;
  }
  .demo .cap { text-align:center; padding-bottom:22px; text-shadow:0 2px 6px rgba(0,0,0,.9),0 0 3px rgba(0,0,0,.9); }
  .demo .l1 { font-size:clamp(18px,3.5vw,24px); font-weight:600; }
  .demo .l2 { font-size:clamp(15px,3vw,20px); color:var(--warm); }
  .demo .tag { position:absolute; top:12px; left:14px; font-size:12px; color:var(--muted); letter-spacing:2px; }
  p { margin:.5em 0; }
  .muted { color:var(--muted); }
  a { color:#ff8a8a; text-decoration:none; } a:hover { text-decoration:underline; }
  .dl { display:grid; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); gap:14px; margin:0 0 12px; }
  .btn {
    display:block; background:var(--panel); border:1px solid var(--line); border-radius:12px;
    padding:16px 18px; color:var(--text); text-decoration:none; transition:border-color .15s, background .15s;
  }
  .btn:hover { background:#1d1d1d; border-color:var(--red); text-decoration:none; }
  .btn .t { display:block; font-size:17px; font-weight:600; }
  .btn .s { display:block; font-size:13px; color:var(--muted); margin-top:2px; }
  .ver { font-size:13px; color:var(--muted); margin:0 0 4px; }
  .foot { margin-top:40px; padding-top:18px; border-top:1px solid var(--line); color:var(--muted); font-size:13px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <div class="brand"><span class="bar bar-red"></span><span class="bar bar-pale"></span></div>
    <button type="button" id="lang" class="langbtn"></button>
  </div>
  <h1>sub-NF</h1>
  <p class="lede" data-i18n="lede"></p>

  <div class="demo">
    <span class="tag">SUB-NF</span>
    <div class="cap">
      <div class="l1">Are you telling me you built this?</div>
      <div class="l2">你是說這是你做的？</div>
    </div>
  </div>

  <div class="dl">
    <a class="btn" href="./downloads/sub-NF-Chrome.zip" download>
      <span class="t" data-i18n="chromeT"></span>
      <span class="s" data-i18n="chromeS"></span>
    </a>
    <a class="btn" href="./downloads/sub-NF-Safari.zip" download>
      <span class="t" data-i18n="safariT"></span>
      <span class="s" data-i18n="safariS"></span>
    </a>
  </div>
  <p class="ver">v1.4.7</p>

  <div class="foot">
    <p data-i18n="legal"></p>
    <p><span data-i18n="license"></span> · <a href="https://github.com/githog-C/githog-C.github.io/tree/main/sub-NF" data-i18n="source"></a></p>
  </div>
</div>

<script>
(function () {
  'use strict';
  var STR = {
    zh: {
      _btn: 'EN', _lang: 'zh-Hant',
      lede: '兩種字幕語言同時顯示在 Netflix 上，取自 Netflix 自己的字幕軌。為語言學習而做。',
      chromeT: 'Chrome / Edge / Brave',
      chromeS: '解壓後載入未封裝資料夾即可使用',
      safariT: 'Safari（macOS）',
      safariS: '用 Xcode 打包一次後啟用',
      legal: '個人、私人的語言學習用途。請遵守 Netflix 使用條款與當地著作權法。「Netflix」為 Netflix, Inc. 之商標；本工具與其無任何從屬或背書關係。',
      license: 'MIT，見專案根目錄 LICENSE。',
      source: '原始碼'
    },
    en: {
      _btn: '中', _lang: 'en',
      lede: "Two subtitle languages at once on Netflix, taken from Netflix's own subtitle tracks. Built for language learning.",
      chromeT: 'Chrome / Edge / Brave',
      chromeS: 'Unzip, then load the unpacked folder.',
      safariT: 'Safari (macOS)',
      safariS: 'Build once in Xcode, then enable it.',
      legal: 'For personal, private language study. Follow the Netflix Terms of Use and your local copyright law. "Netflix" is a trademark of Netflix, Inc.; this tool is not affiliated with or endorsed by them.',
      license: 'MIT — see LICENSE in the project root.',
      source: 'Source'
    }
  };

  function pick() {
    try {
      var saved = localStorage.getItem('subnf-lang');
      if (saved === 'zh' || saved === 'en') return saved;
    } catch (e) { /* private mode, fall through */ }
    return /^zh\b/i.test(navigator.language || '') ? 'zh' : 'en';
  }

  var lang = pick();

  function apply() {
    var t = STR[lang];
    var nodes = document.querySelectorAll('[data-i18n]');
    for (var i = 0; i < nodes.length; i++) {
      var k = nodes[i].getAttribute('data-i18n');
      if (t[k]) nodes[i].textContent = t[k];
    }
    document.getElementById('lang').textContent = t._btn;
    document.documentElement.lang = t._lang;
  }

  document.getElementById('lang').addEventListener('click', function () {
    lang = (lang === 'zh') ? 'en' : 'zh';
    try { localStorage.setItem('subnf-lang', lang); } catch (e) { /* ignore */ }
    apply();
  });

  apply();
})();
</script>
</body>
</html>
